# Keys the device YAML may expect. Do not commit real values.
# HA ESPHome add-on: add these to the add-on's secrets.yaml (Secrets in the
#   dashboard, i.e. HA's /config/esphome/secrets.yaml).
# Building outside HA: copy to esphome/secrets.yaml (gitignored).

wifi_ssid: "YOUR_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# Captive fallback AP
ap_password: "CHANGE_ME_AP_PASSWORD"

# --- Home Assistant API mode (examples/ha-api.yaml) ---
# Generate via ESPHome dashboard or https://esphome.io/components/api/
api_encryption_key: "BASE64_KEY"

# --- MQTT-only mode (examples/mqtt-only.yaml) ---
# mqtt_broker: "mqtt.example.local"
# mqtt_username: "YOUR_MQTT_USER"
# mqtt_password: "YOUR_MQTT_PASSWORD"

# Optional OTA
# ota_password: "YOUR_OTA_PASSWORD"
