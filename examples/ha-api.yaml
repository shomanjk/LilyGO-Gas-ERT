# LilyGO Gas ERT — Home Assistant via native ESPHome API (recommended default)
#
# No MQTT required. Adopt the device in HA's ESPHome integration; gas entities
# appear from the `consumption:` / `rssi:` sensors below.
#
# Hardware: LilyGO T3 / LoRa32 V2.1_1.6.1 915 MHz (SX1276). Confirm DIO2 → GPIO32.
# Flash USB serial at 115200 if the board uses a CH9102.
#
# 1. Copy into the HA ESPHome add-on (or use as a starting point).
# 2. Set substitutions (meter id, frequency for *your* site).
# 3. Add wifi + api secrets; Install.
# 4. Verify scale/units against your dial or bill (see README *Units*).

substitutions:
  device_name: lilygo-gas-ert
  friendly_name: LilyGO Gas ERT
  # Measure your meter's channels (e.g. rtl_433 -M level). Example site used
  # ~914.65 and ~914.83 MHz; 914.825 is a reasonable starting park frequency.
  ert_frequency: "914.825MHz"
  ert_bandwidth: "250_0kHz"
  ert_rx_floor: "-90"
  house_meter_id: "YOUR_METER_ID"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Itron ERT-SCM RX via SX1276 OOK (not LoRa)"

esp32:
  board: ttgo-lora32-v21
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true
  cpu_frequency: 240MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "${device_name}-fallback"
    password: !secret ap_password

captive_portal:

time:
  - platform: sntp
    id: sntp_time

spi:
  # LilyGO T3 hardwires SX1276 SCK to GPIO5 (ESP32 strapping pin).
  clk_pin:
    number: GPIO5
    ignore_strapping_warning: true
  mosi_pin: GPIO27
  miso_pin: GPIO19

sx127x:
  id: radio
  cs_pin: GPIO18
  rst_pin: GPIO23
  dio0_pin: GPIO26
  frequency: ${ert_frequency}
  modulation: OOK
  packet_mode: false
  rx_start: true
  rx_floor: ${ert_rx_floor}
  bandwidth: ${ert_bandwidth}
  bitsync: true
  bitrate: 32768

remote_receiver:
  id: ook_rx
  pin: GPIO32
  filter: 10us
  idle: 250us
  rmt_symbols: 384
  receive_symbols: 384

external_components:
  - source:
      type: git
      url: https://github.com/shomanjk/LilyGO-Gas-ERT
      ref: v1.1.1
    components: [ert_scm]
    refresh: 1d

ert_scm:
  id: gas_ert
  receiver_id: ook_rx
  sx127x_id: radio
  time_id: sntp_time
  scale: 100
  meters:
    - id: ${house_meter_id}
      name: House gas
      enabled: true
      history: true
      consumption:
        name: "House gas consumption"
        # Exposed to HA via the native API (not internal).
      rssi:
        name: "House gas RSSI"
        entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Status"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

text_sensor:
  - platform: version
    name: "ESPHome Version"

button:
  - platform: restart
    name: "Restart"
